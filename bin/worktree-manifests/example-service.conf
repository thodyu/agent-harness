# Manifest for worktree-new.sh: one file per repository, named after the last part of the checkout's origin URL in lower case.
# Read with git config --file. Placeholders: {issue}, {slug}, and {parent} for the checkout's parent folder.
#
# repo.origin   must name the same host/owner/repo as the checkout's origin remote.
# repo.worktree where the ticket's worktree goes. It must be an absolute path.
# repo.branch   the ticket's branch, made from the default branch with no upstream.
# repo.remote   true lets a cloud machine set this repository up. A cloud machine refuses a manifest without it,
#               and refuses any manifest that has a copy.path, so no secret of the control machine is ever copied there.
# copy.from and copy.path (one line for each file or folder) copy files that git ignores into the worktree, on the control machine only.
# setup.dir and setup.run (one line for each command) run in order inside the worktree, and a failed command undoes the whole worktree.
[repo]
	origin = https://github.com/example-org/example-service
	worktree = {parent}/example-service-{issue}-{slug}
	branch = ticket/{issue}-{slug}
	remote = true
[setup]
	run = npm ci --ignore-scripts
