# The machines the orchestrator scripts know, one per line: <label> <authors> <reviewers> <floor GB>
# Read by machine-lib.sh. A # starts a comment. A label holds lower case letters, digits and hyphens only.
# local is the control machine's own Herdr server and is never passed to herdr as a --machine. Any other label must also be a saved machine in herdr machine list.
# The flags --floor, --authors and --reviewers of slots.sh override these limits.
# This is a sample. Set the limits to what each machine can carry.
local 2 1 1.5
# cloud is a rented server with more memory than the control machine, so it takes more agents.
cloud 12 6 4
